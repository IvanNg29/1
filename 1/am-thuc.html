<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ẩm thực đặc sản | Đồng Tháp</title>
<meta name="description" content="Hủ tiếu Sa Đéc, lẩu cá linh bông điên điển, nem Lai Vung, trà tim sen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<section class="ph"><div class="w"><h1 class="r">Thực đơn Đồng Tháp</h1><p class="r">Bấm vào từng món để biết nguồn gốc và hương vị.</p></div></section>
<!-- Thêm món: copy một nút .mon rồi sửa data-ten / data-goc / data-vi -->
<section class="sec" style="padding-top:40px"><div class="w">
  <button class="mon r" data-ten="Hủ tiếu Sa Đéc" data-goc="Sa Đéc, bên dòng sông Tiền." data-vi="Sợi gạo mềm dai, nước dùng ngọt thanh từ xương heo; ăn nước hoặc ăn khô với tôm, thịt, rau sống."><b>Hủ tiếu Sa Đéc</b><span>Sợi gạo mềm dai, nước dùng ngọt xương</span></button>
  <button class="mon r" data-ten="Lẩu cá linh bông điên điển" data-goc="Mùa nước nổi khắp vùng Đồng Tháp Mười, khi cá linh theo con nước về." data-vi="Nước lẩu chua dịu, cá linh ngọt thịt, bông điên điển bùi nhẹ; ăn cùng rau đồng và bún."><b>Lẩu cá linh bông điên điển</b><span>Hương vị của mùa nước nổi</span></button>
  <button class="mon r" data-ten="Nem Lai Vung" data-goc="Lai Vung, vùng đất còn nổi tiếng với quýt hồng." data-vi="Chua ngọt, giòn dai, thơm lá chùm ruột, cay nhẹ của tỏi ớt; ăn kèm rau sống."><b>Nem Lai Vung</b><span>Nem chua gói lá, lên men tự nhiên</span></button>
  <button class="mon r" data-ten="Chuột đồng quay lu" data-goc="Cao Lãnh và những vùng đồng ruộng, nhất là quanh mùa gặt." data-vi="Da vàng giòn, thịt thơm ngọt mùi gia vị ướp; quay trong lu đất nung."><b>Chuột đồng quay lu</b><span>Món đồng quê quay trong lu đất</span></button>
  <button class="mon r" data-ten="Bánh xèo Cao Lãnh" data-goc="Cao Lãnh." data-vi="Vỏ giòn vàng, nhân tôm thịt giá; cuốn bánh tráng với rau rừng, chấm nước mắm chua ngọt."><b>Bánh xèo Cao Lãnh</b><span>Giòn nóng, cuốn rau rừng</span></button>
  <button class="mon r" data-ten="Trà tim sen" data-goc="Những đầm sen Đồng Tháp; tim sen là mầm xanh nằm giữa hạt sen." data-vi="Vị đắng thanh, hậu ngọt dịu; theo dân gian giúp thanh nhiệt, dễ ngủ."><b>Trà tim sen</b><span>Đắng thanh, hậu ngọt dịu</span></button>
</div></section>

<div id="site-footer"></div>
<script src="animations.js"></script>
</body>
</html>
